services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    hostname: sqlserver
    env_file:
      - configs/.env # Mantém o arquivo de ambiente
    environment:
      - ACCEPT_EULA=Y
      # - SA_PASSWORD=davi2003 # REMOVA ESTA LINHA para usar a do .env
      - SA_PASSWORD=Davi2003Ag0ra! # Use a variável do .env
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # Use a variável para a senha aqui também, ou a senha forte diretamente
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -U sa -P \"$${SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 15
      start_period: 60s

  sge:
    build: .
    container_name: sge-app
    ports:
      - "8080:8080"
    env_file:
      - configs/.env
    environment:
      - DB_HOST=sqlserver
      - DB_USER=sa
      - DB_PASSWORD=Davi2003Ag0ra! # Use a variável do .env
    depends_on:
      sqlserver:
        condition: service_healthy
    # Mude localhost para sqlserver
    entrypoint: /bin/sh -c "while ! nc -z sqlserver 1433; do sleep 2; done && /app/meuApp"
    networks:
      - network-sge

  db-init:
    image: mcr.microsoft.com/mssql-tools
    volumes:
      - ./configs:/scripts
    env_file:
      - configs/.env
    # Mude localhost para sqlserver e use a variável para a senha
    entrypoint: /bin/bash -c "while ! nc -z sqlserver 1433; do sleep 2; done && /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$${SA_PASSWORD}\" -d master -i /scripts/SGE.sql || exit 0"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - network-sge

networks:
  network-sge:
    driver: bridge

volumes:
  sqlserver_data:
    name: sge_sql_data